# ElasticMQ: servidor compatible con la API de Amazon SQS, solo para desarrollo local.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  ordenes-emision-dlq { }
  ordenes-emision {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "ordenes-emision-dlq"
      maxReceiveCount = 5
    }
  }
}
