server:
  port: ${PORT:8083}

spring:
  application:
    name: ordenes-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:ordenesdb;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eventpass:
  security:
    jwt-secret: ${JWT_SECRET:clave-solo-para-desarrollo-local-32-caracteres!}
    gateway-key: ${GATEWAY_KEY:}
    internal-key: ${INTERNAL_API_KEY:dev-internal-key}
  sqs:
    region: ${AWS_REGION:us-east-1}
    # Vacio = AWS real. Local: ElasticMQ (compatible con la API de SQS)
    endpoint: ${SQS_ENDPOINT:}
    queue-url: ${SQS_QUEUE_URL:http://elasticmq:9324/000000000000/ordenes-emision}
