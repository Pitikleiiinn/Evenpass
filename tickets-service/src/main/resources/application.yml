server:
  port: ${PORT:8084}

spring:
  application:
    name: tickets-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:ticketsdb;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eventpass:
  security:
    jwt-secret: ${JWT_SECRET:clave-solo-para-desarrollo-local-32-caracteres!}
    gateway-key: ${GATEWAY_KEY:}
    internal-key: ${INTERNAL_API_KEY:dev-internal-key}
